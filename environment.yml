# GPU-capable default Conda environment (Windows / Linux, NVIDIA CUDA 12).
# Create from the cloned repository root:
#   conda env create -f environment.yml
#   conda activate calvados-tea-idp-simulator
#   python -m openmm.testInstallation
#   python -m streamlit run app.py
#
# Install OpenMM and its CUDA 12 platform using conda-forge BEFORE pip:
# pip's openmm[cuda12] extra alone did not register CUDA on Windows.
# The NVIDIA driver is a system prerequisite and is not installed by Conda.
# CPU is also selectable in ELP Studio.
name: calvados-tea-idp-simulator
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - "openmm>=8.2,<8.5"
  - "cuda-version=12"
  - pip:
      - -e .[app,analysis]
