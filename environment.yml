# Minimal Windows NVIDIA GPU foundation; avoid a huge all-Conda solve.
# OpenMM 8.2.0 Windows py311 requires CUDA 12.x and scipy<1.14.
# This pins driver-compatible CUDA 12.8 (not 12.9).
# Other scientific/app Python packages install in windows/finish_install.cmd,
# with constraints preventing pip from upgrading OpenMM or numpy.
name: calvados-tea-idp-simulator
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - openmm=8.2.0
  - cuda-version=12.8
  - numpy>=1.23.5,<2
  - scipy<1.14
