# Windows GPU environment: Python 3.11 + CUDA 12.8.
# The win-64 OpenMM 8.2 py311 build requires CUDA 12 (not cudatoolkit 11.8).
# Driver 573.71 reports CUDA 12.8; forbid accidental selection of 12.9.
#
# IMPORTANT: pinned upstream CALVADOS 0.9.1 declares openmm[cuda12].
# Install CALVADOS and this application separately with pip --no-deps
# to prevent pip from replacing conda-forge's OpenMM/CUDA runtime.
#
# From the repository root:
#   conda env create -f environment.yml
#   conda activate calvados-elp-gpu128
#   python -m openmm.testInstallation
#   windows\finish_install.cmd
name: calvados-elp-gpu128
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - openmm=8.2.0
  - cuda-version=12.8
  - numpy>=1.23.5,<2
  - scipy<1.14
  - pandas
  - mdanalysis>=2.9,<2.11
  - mdtraj>=1.11,<1.12
  - biopython
  - jinja2
  - tqdm
  - matplotlib
  - pyyaml
  - pydantic>=2,<3
  - statsmodels
  - numba
  - streamlit>=1.52
  - plotly
  - openpyxl
  - pytest
