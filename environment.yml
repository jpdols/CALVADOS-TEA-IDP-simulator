# Windows CUDA 11.8 reference environment.
# Verified hardware reference: Quadro P1000, driver 573.71, OpenMM 8.2.0
# from conda-forge with cudatoolkit 11.8.0 (old mep-calvados environment).
#
# IMPORTANT: upstream CALVADOS 0.9.1 declares openmm[cuda12]>=8.2,<8.5.
# NEVER put pip -e .[app,analysis] here: pip could replace the CUDA 11 build.
# Install pinned CALVADOS and ELP Studio with --no-deps using
# windows/install_gpu11_environment.cmd after this Conda stage.
#
# OpenMM 8.2.0 + CUDA 11.8 with Python 3.11 is a candidate combination.
# The known-good reference used Python 3.10; test this new combination
# with python -m openmm.testInstallation before running CALVADOS.
name: calvados-elp-gpu11
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - openmm=8.2.0
  - cudatoolkit=11.8.0
  - numpy
  - pandas
  - mdanalysis>=2.9,<2.11
  - mdtraj>=1.11,<1.12
  - biopython
  - jinja2
  - tqdm
  - matplotlib
  - pyyaml
  - pydantic>=2,<3
  - statsmodels
  - numba
  - scipy
  - streamlit>=1.52
  - plotly
  - openpyxl
  - pytest
