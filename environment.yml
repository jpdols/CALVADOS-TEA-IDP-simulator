# Cross-platform CPU baseline for one-command ELP Studio installation.
# Run: python install.py
# The installer attempts CUDA 11.8 on machines with an NVIDIA GPU; if
# unavailable or the CUDA force test fails, it installs this CPU baseline.
# Do not put pip package extras here: CALVADOS 0.8.0 is installed from a
# pinned public GitHub revision, with --no-deps, by install.py.
name: calvados-tea-idp-simulator
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - git
  - setuptools>=77
  - wheel
  - openmm=8.2.0
  - numpy=1.26.4
  - scipy=1.15.2
  - mdanalysis=2.6.1
  - mdtraj=1.10.3
  - biopython=1.81
  - pandas=2.2.2
  - matplotlib
  - jinja2
  - pyyaml
  - tqdm
  - statsmodels
  - numba=0.60
  - pytest
